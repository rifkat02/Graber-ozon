name: Ozon Video Grabber

on:
  workflow_dispatch:
    inputs:
      product_url:
        description: 'Ссылка или ID товара на Ozon'
        required: true
        default: '100000000'

jobs:
  run-grabber:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run grabber script
        run: |
          python ozon_video_grabber.py "${{ github.event.inputs.product_url }}"

      - name: Upload downloaded videos as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ozon-video-reviews
          path: ozon_videos/
